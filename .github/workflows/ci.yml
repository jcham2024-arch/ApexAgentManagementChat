name: ci
on:
  push:
    branches: ["main", "phase/**"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Root reactor: the group parents (project/apex-chat, project/apex-core,
      # project/apex-platform) plus the adapters with no group parent.
      - name: Build and test (root reactor)
        run: mvn -B -q install

      # install (not just test) so the engine reactor can resolve the Tier 0
      # artifacts it consumes: apex-chat-domain, apex-chat-core, engine-core
      # and engine-json all live in this reactor.

      - name: Build and test (apex engine reactor)
        run: mvn -B -q -f project/apex/pom.xml test

      - name: Package tier-0 jars
        run: |
          mvn -B -q package -DskipTests
          mvn -B -q -f project/apex/pom.xml package -DskipTests

      - name: Gate G2 — jdeps bytecode purity (Tier 0 only)
        run: |
          set -euo pipefail
          mapfile -t TIER0_JARS < <(find \
            project/apex-chat/apex-chat-domain project/apex-chat/apex-chat-core \
            project/apex-core/engine-core project/apex-core/engine-planner \
            project/apex-core/engine-tools project/apex-core/engine-store \
            project/engine-memory project/engine-json \
            -path '*/target/*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' \
            2>/dev/null)
          if [ ${#TIER0_JARS[@]} -eq 0 ]; then
            echo "GATE G2 FAILED: no Tier 0 jars produced"; exit 1
          fi
          FAILED=0
          for jar in "${TIER0_JARS[@]}"; do
            echo "Inspecting $jar"
            OUTPUT=$(jdeps --ignore-missing-deps --multi-release 21 "$jar" 2>/dev/null) || true
            if echo "$OUTPUT" | grep -qE 'org\.springframework|org\.embabel|com\.google\.cloud|com\.google\.mcp|com\.fasterxml\.jackson|io\.micrometer|com\.zaxxer'; then
              echo "GATE G2 FAILED: enterprise package in $jar"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi
          echo "GATE G2 PASSED"
