name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  verify:
    name: Build, Invariants & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Gate K1 - No dynamic JVM classloading
        run: |
          echo "Verifying K1: zero defineClass / URLClassLoader..."
          if grep -rn --exclude-dir=test "defineClass\|URLClassLoader" kernel/ evolution/ plugin-host/ ipc-omnibus/ os-automation/ 2>/dev/null; then
            echo "K1 violation: dynamic JVM classloading found!"
            exit 1
          fi
          echo "K1 PASS"

      - name: Gate K2 - No shell interpolation or Runtime.exec(String)
        run: |
          echo "Verifying K2: zero Runtime.exec(String) / shell interpolation..."
          if grep -rn "Runtime.getRuntime().exec(" kernel/ evolution/ plugin-host/ ipc-omnibus/ os-automation/ 2>/dev/null; then
            echo "K2 violation: Runtime.exec found!"
            exit 1
          fi
          if grep -rn "/bin/sh -c\|cmd.exe /c" kernel/ evolution/ plugin-host/ ipc-omnibus/ os-automation/ 2>/dev/null; then
            echo "K2 violation: shell interpolation found!"
            exit 1
          fi
          echo "K2 PASS"

      - name: Run Maven Tests
        run: |
          if [ -f "./mvnw" ]; then
            chmod +x ./mvnw
            ./mvnw clean test --batch-mode --no-transfer-progress
          else
            mvn clean test --batch-mode --no-transfer-progress
          fi
