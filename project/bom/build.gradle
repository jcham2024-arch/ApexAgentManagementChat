plugins {
    id 'java-platform'
}

group = 'com.apex'
version = '0.1.0-SNAPSHOT'

javaPlatform {
    allowDependencies()
}

dependencies {
    api enforcedPlatform('org.junit.jupiter:junit-jupiter:5.10.2')
    api enforcedPlatform('org.assertj:assertj-core:3.25.3')
    api project(':core-engine')
    api project(':testkit')
    api project(':platform-desktop')
}
