buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.0'
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
    }

    group = 'com.apex'
    version = '0.1.0-SNAPSHOT'
}

subprojects {
    tasks.withType(Test) {
        useJUnitPlatform()
    }
}
